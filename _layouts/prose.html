---
layout: base
---

<article class="container container-narrow prose" style="padding-top: var(--space-3xl); padding-bottom: var(--space-3xl);">
  {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
  {% if page.updated %}<p class="text-secondary">{%- assign ui = site.ui_strings[page.lang] | default: site.ui_strings.en -%}<small>{{ ui.last_updated }}: {{ page.updated }}</small></p>{% endif %}

  {{ content }}
</article>
