title: KhassinX
description: Independent studio building privacy-first apps for Apple platforms — on-device AI, native across iPhone, iPad, Mac and Apple Watch, zero tracking.
url: https://khassinx.com
lang: en

# Layer 1 umbrella site
umbrella_tokens: true

# Favicons (umbrella K monogram)
favicon_svg: /assets/favicons/favicon.svg
favicon_32: /assets/favicons/favicon-32.png
favicon_16: /assets/favicons/favicon-16.png
apple_touch_icon: /assets/favicons/apple-touch-icon.png

# Social / Open Graph + Twitter
og_site_name: KhassinX
og_image: /assets/og/og-image.png
og_image_width: 1200
og_image_height: 630
og_image_alt: "KhassinX — privacy-first apps for Apple platforms"
twitter_card: summary_large_image

# Organization (JSON-LD structured data + contact)
org:
  name: KhassinX
  legal_name: KHASSINX LLC
  founding_date: "2026-06-01"
  email: hello@khassinx.com
  logo: /assets/favicons/icon-512.png
  same_as:
    - https://github.com/KhassinX

# SEO sitemap (GitHub Pages whitelisted plugin)
plugins:
  - jekyll-sitemap

# Navigation — keyed por locale. El layout selecciona via page.lang con fallback a 'en'.
nav:
  en:
    - title: Apps
      url: "#apps"
    - title: Contact
      url: "mailto:hello@khassinx.com"
  es:
    - title: Apps
      url: "/es/#apps"
    - title: Contacto
      url: "mailto:hello@khassinx.com"

footer_nav:
  en:
    - title: Security
      url: "/security/"
    - title: Legal
      url: "/legal/"
    - title: Contact
      url: "mailto:hello@khassinx.com"
  es:
    - title: Seguridad
      url: "/es/security/"
    - title: Legal
      url: "/es/legal/"
    - title: Contacto
      url: "mailto:hello@khassinx.com"

# Skip-link y "Part of ecosystem" copy por locale (lo consume base.html)
ui_strings:
  en:
    skip_to_main: "Skip to main content"
    part_of_ecosystem_prefix: "Part of the"
    part_of_ecosystem_label: "KhassinX ecosystem"
    ecosystem_url: "https://khassinx.com"
  es:
    skip_to_main: "Saltar al contenido principal"
    part_of_ecosystem_prefix: "Parte del"
    part_of_ecosystem_label: "ecosistema KhassinX"
    ecosystem_url: "https://khassinx.com/es/"

# Jekyll config
markdown: kramdown

exclude:
  - README.md
  - .gitignore
  - LICENSE

# Jekyll por default ignora dotfiles/dotdirs. .well-known DEBE servirse
# (RFC 9116 security.txt requiere path exacto /.well-known/security.txt).
include:
  - .well-known
