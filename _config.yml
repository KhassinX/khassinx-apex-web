title: KHASSINX
short_name: KHASSINX   # nombre bajo el icono en Add-to-Home (apple-mobile-web-app-title / manifest short_name) — NO el <title> largo
description: Independent studio building privacy-first apps for Apple platforms — on-device AI, native across iPhone, iPad, Mac and Apple Watch, zero tracking.
url: https://khassinx.com
lang: en

# Layer 1 umbrella site
umbrella_tokens: true

# Favicons (umbrella K monogram)
favicon_svg: /assets/favicons/favicon.svg
favicon_32: /assets/favicons/favicon-32.png
favicon_16: /assets/favicons/favicon-16.png
apple_touch_icon: /assets/favicons/apple-touch-icon.png

# Social / Open Graph + Twitter
og_site_name: KHASSINX
og_image: /assets/og/og-image-{lang}.png
og_image_width: 1200
og_image_height: 630
og_image_alt: "KHASSINX — apps that keep your data on your device and in your iCloud"
og_image_alt_es: "KHASSINX — apps que guardan tus datos en tu dispositivo y en tu iCloud"
twitter_card: summary_large_image

# Organization (JSON-LD structured data + contact)
org:
  name: KHASSINX
  legal_name: KHASSINX LLC
  founding_date: "2026-06-01"
  email: hello@khassinx.com
  logo: /assets/favicons/icon-512.png
  same_as:
    - https://github.com/khassinx

# SEO sitemap (GitHub Pages whitelisted plugin)
plugins:
  - jekyll-sitemap
whitelist:
  - jekyll-sitemap

# Navigation — keyed por locale. El layout selecciona via page.lang con fallback a 'en'.
nav:
  en:
    - title: Apps
      url: "/#apps"
    - title: Contact
      url: "/contact/"
  es:
    - title: Apps
      url: "/es/#apps"
    - title: Contacto
      url: "/es/contact/"

footer_nav:
  en:
    - title: Privacy
      url: "/legal/privacy/"
    - title: Terms
      url: "/legal/terms/"
    - title: Legal
      url: "/legal/"
    - title: Security
      url: "/security/"
    - title: Contact
      url: "/contact/"
  es:
    - title: Privacidad
      url: "/es/legal/privacy/"
    - title: Términos
      url: "/es/legal/terms/"
    - title: Legal
      url: "/es/legal/"
    - title: Seguridad
      url: "/es/security/"
    - title: Contacto
      url: "/es/contact/"

ui_strings:
  en:
    skip_to_main: "Skip to main content"
    nav_primary: "Primary"
    nav_footer: "Footer"
    effective: "Effective"
    last_updated: "Last updated"
    version: "Version"
    in_short: "In short"
    on_this_page: "On this page"
    related: "Related"
    theme: "Theme"
    theme_system: "System"
    theme_light: "Light"
    theme_dark: "Dark"
  es:
    skip_to_main: "Saltar al contenido principal"
    nav_primary: "Principal"
    nav_footer: "Pie de página"
    effective: "Vigente desde el"
    last_updated: "Última actualización"
    version: "Versión"
    in_short: "En resumen"
    on_this_page: "En esta página"
    related: "Relacionado"
    theme: "Tema"
    theme_system: "Sistema"
    theme_light: "Claro"
    theme_dark: "Oscuro"

# Jekyll config
markdown: kramdown

exclude:
  - README.md
  - .gitignore
  - LICENSE

# Jekyll por default ignora dotfiles/dotdirs. .well-known DEBE servirse
# (RFC 9116 security.txt requiere path exacto /.well-known/security.txt).
include:
  - .well-known
